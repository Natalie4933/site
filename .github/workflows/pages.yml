name: Update tracks and publish Natalie
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public music catalog
        run: |
          python scripts/refresh_tracks.py
      - name: Save updated catalog
        run: |
          git config user.name "Natalie Site Bot"
          git config user.email "natalie-site-bot@users.noreply.github.com"
          git add tracks.json index.html
          if git diff --cached --quiet; then
            echo "Catalog already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh Natalie tracks from Treblo"
            git push origin HEAD:main
            echo "Updated catalog saved and ready to deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
          python -c 'import json; print("Tracks in catalog:", len(json.load(open("tracks.json"))))' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare static output
        run: |
          mkdir -p _site
          cp index.html style.css app.js tracks.json _site/
          cp -r assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
